name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The web fuzz in-process: the registered webs' 1,000 builds, then the fixture's 100
      # (tools/content/fuzzWeb.ts, docs/v3 C6 design §4.9).
      - run: npm run fuzz:web
      # Each simulation scenario timed against the normal run in this job, and the normal
      # run's own budget (tools/balance/bench.ts --check, bench.baseline.json).
      - run: npm run bench -- --check
      # The PR subset of implementation-plan-v3 §4's balance checks on the registered content
      # (tools/balance/v3/checks/cli.ts, docs/v3 C10 design §1.5): report.md goes to the summary.
      - run: npm run checks -- --summary "$GITHUB_STEP_SUMMARY"
      - run: npx vite build
      # The Steam build's page (dist-steam/) and the Electron shell (dist-electron/); no Electron
      # binary is needed to build them (docs/v3 C9 design §1.6).
      - run: npm run build:electron
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 14
      # Electron fetches its ~120 MB binary on its first run or require('electron') from Node, so
      # a test or build step that loaded Electron for real fails here (C9/F1).
      - name: No Electron binary downloaded
        run: test ! -e node_modules/electron/dist
