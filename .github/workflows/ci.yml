name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The web fuzz in-process: the registered webs' 1,000 builds, then the fixture's 100
      # (tools/content/fuzzWeb.ts, docs/v3 C6 design §4.9).
      - run: npm run fuzz:web
      # Each simulation scenario timed against the normal run in this job, and the normal
      # run's own budget (tools/balance/bench.ts --check, bench.baseline.json).
      - run: npm run bench -- --check
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 14
