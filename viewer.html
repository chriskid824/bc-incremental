<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web viewer</title>
    <!-- Dev-only viewer of the v3 webs (npm run dev, then /viewer.html; ?fixture for the test
         fixture). It is not a build input. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f5f8;
        color: #1f2329;
        font-family:
          'Noto Sans', 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', 'WenQuanYi Zen Hei',
          sans-serif;
        font-size: 13px;
      }
      #viewer {
        display: grid;
        grid-template-columns: 1fr 420px;
        grid-template-rows: auto 1fr;
        height: 100%;
      }
      header {
        grid-column: 1 / 3;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: #ffffff;
        border-bottom: 1px solid #d9dce3;
      }
      header h1 {
        margin: 0 8px 0 0;
        font-size: 15px;
        font-weight: 600;
      }
      header .summary {
        color: #5c6270;
      }
      #web {
        overflow: auto;
        min-height: 0;
      }
      #web svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #web .node,
      #web .board {
        cursor: pointer;
      }
      #web .node.selected circle,
      #web .node.selected polygon,
      #web .node.selected rect {
        stroke: #1a73e8;
        stroke-width: 7;
      }
      aside {
        overflow: auto;
        min-height: 0;
        padding: 10px 14px;
        background: #ffffff;
        border-left: 1px solid #d9dce3;
      }
      aside h2 {
        margin: 12px 0 6px;
        font-size: 13px;
        font-weight: 600;
        color: #5c6270;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .text {
        margin: 0 0 8px;
        padding: 8px 10px;
        background: #f7f8fa;
        border: 1px solid #e3e5ea;
        border-radius: 6px;
        line-height: 1.5;
      }
      .text .name {
        font-weight: 600;
      }
      .text .kind,
      .text .id {
        color: #7d838f;
      }
      .issues li {
        margin-bottom: 4px;
        color: #a3261c;
        word-break: break-word;
      }
      .empty {
        color: #7d838f;
      }
    </style>
  </head>
  <body>
    <main id="viewer"></main>
    <script type="module" src="/src/app/viewer.ts"></script>
  </body>
</html>
